<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — Tourist.uz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="nav"></header>
  <main class="container">
    <div class="card auth-card">
      <h1 style="font-size:1.8rem">👤 <span data-i18n="login.t"></span></h1>
      <p class="muted small" data-i18n="login.sub"></p>

      <div id="disabledBox" class="notice hidden" data-i18n="login.disabled"></div>
      <div id="loggedBox" class="hidden"></div>

      <div id="authBox" class="hidden">
        <button class="btn ghost" id="googleBtn" style="width:100%">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span data-i18n="login.google"></span>
        </button>
        <div class="divider" data-i18n="login.or"></div>

        <form id="authForm">
          <div class="field hidden" id="nameField"><label for="aName" data-i18n="login.name"></label><input id="aName" autocomplete="name"></div>
          <div class="field"><label for="aEmail" data-i18n="login.email"></label><input id="aEmail" type="email" required autocomplete="email"></div>
          <div class="field"><label for="aPass" data-i18n="login.pass"></label><input id="aPass" type="password" required minlength="6" autocomplete="current-password"></div>
          <button class="btn" type="submit" id="submitBtn" style="width:100%"></button>
        </form>
        <div class="row" style="justify-content:space-between;margin-top:14px">
          <a href="#" id="toggleMode" class="small"></a>
          <a href="#" id="forgot" class="small" data-i18n="login.forgot"></a>
        </div>
        <p id="aStatus" class="small" style="margin-top:12px;color:var(--danger)"></p>
      </div>
    </div>
  </main>
  <footer id="foot"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/vendor/firebase/firebase.bundle.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script>
    renderNav("");
    const $ = id => document.getElementById(id);
    let mode = "signin";
    // Faqat sayt ichidagi sahifaga qaytish (tashqi havolaga yo'naltirishning oldini olish)
    const nextParam = new URLSearchParams(location.search).get("next") || "";
    const next = /^[a-z]+\.html$/.test(nextParam) ? nextParam : "index.html";

    function renderMode() {
      $("nameField").classList.toggle("hidden", mode !== "signup");
      $("submitBtn").textContent = t(mode === "signup" ? "login.signup" : "login.signin");
      $("toggleMode").textContent = t(mode === "signup" ? "login.toSignin" : "login.toSignup");
      $("aPass").autocomplete = mode === "signup" ? "new-password" : "current-password";
    }
    function busy(on) { document.querySelectorAll("#authBox button").forEach(b => b.disabled = on); }
    function fail(e) { busy(false); $("aStatus").textContent = authError(e); }

    cloud.onChange(user => {
      $("disabledBox").classList.toggle("hidden", cloud.enabled);
      $("authBox").classList.toggle("hidden", !cloud.enabled || !!user);
      $("loggedBox").classList.toggle("hidden", !user);
      if (user) {
        $("loggedBox").innerHTML = `<p>✅ ${t("login.hello")}, <b>${esc(user.name)}</b> (${esc(user.email)})</p>
          <a class="btn" href="${next}">${t("common.next")} →</a>`;
        if (nextParam) setTimeout(() => { location.href = next; }, 800);
      }
    });

    $("toggleMode").onclick = e => { e.preventDefault(); mode = mode === "signin" ? "signup" : "signin"; renderMode(); };
    $("googleBtn").onclick = () => { busy(true); $("aStatus").textContent = ""; cloud.signInGoogle().catch(fail); };
    $("authForm").addEventListener("submit", e => {
      e.preventDefault(); busy(true); $("aStatus").textContent = "";
      const email = $("aEmail").value.trim(), pass = $("aPass").value;
      (mode === "signup" ? cloud.signUp($("aName").value.trim(), email, pass) : cloud.signIn(email, pass)).catch(fail);
    });
    $("forgot").onclick = e => {
      e.preventDefault();
      const email = $("aEmail").value.trim();
      if (!email) { $("aEmail").focus(); return; }
      cloud.resetPassword(email).then(() => toast(t("login.resetSent"), "ok")).catch(fail);
    };
    document.addEventListener("langchange", renderMode);
    renderMode();
  </script>
</body>
</html>
