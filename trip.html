<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayohat — Tourist.uz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Philosopher:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <div class="container page-head">
      <div class="stepper" id="stepper"><span></span><span></span><span></span><span></span></div>
    </div>

    <!-- 1-qadam: fuqarolik -->
    <section class="container step" id="step1">
      <h2 class="ornament-title"><span data-i18n="trip.s1"></span></h2>
      <p class="muted" data-i18n="trip.s1.h"></p>
      <input id="countrySearch" type="search" placeholder="🔎 Search / Qidirish" style="max-width:360px;margin-bottom:14px">
      <div class="choice-grid" id="countries"></div>
      <p class="notice info" style="margin-top:20px"><span data-i18n="trip.visa"></span>
        <a href="https://e-visa.gov.uz" target="_blank" rel="noopener">e-visa.gov.uz</a></p>
    </section>

    <!-- 2-qadam: hudud -->
    <section class="container step hidden" id="step2">
      <h2 class="ornament-title"><span data-i18n="trip.s2"></span></h2>
      <div class="choice-grid" id="regions"></div>
      <div class="row" style="margin-top:20px"><button class="btn ghost" onclick="go(1)">← <span data-i18n="common.back"></span></button></div>
    </section>

    <!-- 3-qadam: joylar -->
    <section class="step hidden" id="step3">
      <div class="container">
        <div class="row" style="justify-content:space-between">
          <div>
            <h2 class="ornament-title"><span data-i18n="trip.s3"></span></h2>
            <p class="muted" data-i18n="trip.s3.h"></p>
          </div>
          <button class="btn ghost sm" id="aiRankBtn">✨ <span data-i18n="trip.aiRank"></span></button>
        </div>
        <div id="aiStatus" class="small muted" style="margin-bottom:12px"></div>
        <div class="grid c3" id="places"></div>
      </div>
      <div class="sticky-bar">
        <div class="container">
          <button class="btn ghost" onclick="go(2)">← <span data-i18n="common.back"></span></button>
          <span><span data-i18n="trip.selected"></span>: <b id="selCount">0</b> / 5</span>
          <button class="btn" id="toRoute" onclick="go(4)"><span data-i18n="common.next"></span> →</button>
        </div>
      </div>
    </section>

    <!-- 4-qadam: marshrut -->
    <section class="container step hidden" id="step4">
      <h2 class="ornament-title"><span data-i18n="trip.s4"></span> — <span id="routeRegion"></span></h2>
      <div class="card flat" style="margin-bottom:16px">
        <div class="row" style="gap:20px">
          <div><label for="startTime" data-i18n="trip.start"></label><input type="time" id="startTime" value="09:00" style="width:130px"></div>
          <div><label data-i18n="trip.transport"></label><div class="seg" id="modes"></div></div>
          <button class="btn ghost sm" id="optBtn">🔀 <span data-i18n="trip.optimize"></span></button>
        </div>
      </div>
      <div class="grid c2" style="align-items:start">
        <div class="timeline" id="timeline"></div>
        <div>
          <div class="map" id="routeMap" style="margin-bottom:16px"></div>
          <div class="summary" id="summary"></div>
          <div class="row" style="margin-top:16px">
            <button class="btn gold" id="addAll">🎟️ <span data-i18n="trip.addAll"></span></button>
            <button class="btn ghost" id="tipsBtn">✨ <span data-i18n="trip.aiTips"></span></button>
          </div>
          <div id="tips" class="card flat hidden" style="margin-top:16px"></div>
          <p class="notice small" style="margin-top:16px" data-i18n="trip.trafficNote"></p>
        </div>
      </div>
      <div class="row" style="margin-top:20px"><button class="btn ghost" onclick="go(3)">← <span data-i18n="common.back"></span></button></div>
    </section>
  </main>
  <footer id="foot"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/vendor/firebase/firebase.bundle.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="assets/js/map.js"></script>
  <script src="assets/js/trip.js"></script>
</body>
</html>
