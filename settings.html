<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sozlamalar — Tourist.uz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Philosopher:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="nav"></header>
  <main class="container" style="max-width:760px">
    <div class="page-head"><h1>⚙️ <span data-i18n="set.t"></span></h1></div>

    <div class="card">
      <h2>🤖 <span data-i18n="set.aiTitle"></span></h2>
      <p class="small muted" data-i18n="set.aiAdmin"></p>
      <button class="btn accent" type="button" id="sTest" data-i18n="set.test"></button>
      <p id="sStatus" class="small" style="margin-top:12px"></p>
    </div>

    <div class="card" style="margin-top:20px">
      <h2>🌐 <span data-i18n="set.lang"></span></h2>
      <div class="seg" id="sLang">
        <button data-l="uz">O'zbekcha</button><button data-l="en">English</button><button data-l="ru">Русский</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--border);margin:20px 0">
      <button class="btn danger" id="sReset" data-i18n="set.reset"></button>
    </div>
  </main>
  <footer id="foot"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/vendor/firebase/firebase.bundle.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script>
    renderNav("settings");
    const $ = id => document.getElementById(id);
    const status = (msg, ok) => { $("sStatus").textContent = msg; $("sStatus").style.color = ok === undefined ? "" : ok ? "var(--ok)" : "var(--danger)"; };

    function load() {
      document.querySelectorAll("#sLang button").forEach(b => b.classList.toggle("sel", b.dataset.l === getLang()));
    }
    try { localStorage.removeItem("tu.gemini.key"); } catch (e) { /* eski shaxsiy kalitni tozalash */ }

    $("sTest").onclick = async () => {
      if (!gemini.enabled()) { status(t("ai.off"), false); return; }
      status(t("common.loading"));
      try {
        const txt = await gemini.generate("Reply with exactly: Salom, Tourist.uz!", { temperature: 0 });
        status(`${t("set.testOk")} — «${txt.trim().slice(0, 80)}»`, true);
      } catch (e) { status(`${t("set.testFail")} ${e.message}`, false); }
    };

    $("sLang").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) { setLang(b.dataset.l); load(); } });
    $("sReset").onclick = () => {
      ["trip", "cart", "orders", "lastPlan", "plannerForm", "guideLang", "aiVoice"].forEach(k => store.remove(k));
      try { Object.keys(localStorage).filter(k => k.startsWith("tu.narr.")).forEach(k => localStorage.removeItem(k)); } catch (e) { /* ignore */ }
      updateCartBadge(); toast(t("set.resetDone"), "ok");
    };
    load();
  </script>
</body>
</html>
